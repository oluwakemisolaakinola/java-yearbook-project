---
- name: Configure DevOps Capstone Server
  hosts: webserver
  become: true

  tasks:
    - name: Install required packages
      dnf:
        name:
          - git
          - docker
        state: present
        update_cache: true

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Install Docker Compose plugin
      shell: |
        mkdir -p /usr/local/lib/docker/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64 \
          -o /usr/local/lib/docker/cli-plugins/docker-compose
        chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
      args:
        creates: /usr/local/lib/docker/cli-plugins/docker-compose


    - name: Create application directory
      file:
        path: /home/ec2-user/java-yearbook-project
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy Docker Compose file to EC2
      copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "/home/ec2-user/java-yearbook-project/docker-compose.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Copy portfolio application to EC2
      copy:
        src: "{{ playbook_dir }}/../myportfolio/"
        dest: "/home/ec2-user/java-yearbook-project/myportfolio/"
        owner: ec2-user
        group: ec2-user

    - name: Copy Java application to EC2
      copy:
        src: "{{ playbook_dir }}/../java/"
        dest: "/home/ec2-user/java-yearbook-project/java/"
        owner: ec2-user
        group: ec2-user

    - name: Stop existing application containers
      command:
        cmd: docker compose down
        chdir: /home/ec2-user/java-yearbook-project
      ignore_errors: true

    - name: Deploy applications with Docker Compose
      command:
        cmd: docker compose up -d --build
        chdir: /home/ec2-user/java-yearbook-project
